<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>Notion Button</title>

  <style>
    :root {
      color-scheme: light dark;

      --button-bg: #f1f0ed;
      --button-border: #d8d6d2;
      --button-text: #37352f;
      --button-hover: #ebeae7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --button-bg: #2f2f2f;
        --button-border: #464646;
        --button-text: #f1f1ef;
        --button-hover: #393939;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      background: transparent;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .button {
      width: min(350px, 100%);
      height: 45px;

      position: relative;

      margin: 0;
      padding: 0;

      border: 1px solid var(--button-border);
      border-radius: 8px;

      background: var(--button-bg);
      color: var(--button-text);

      font-family: inherit;
      cursor: pointer;

      outline: none;
      box-shadow: none;

      -webkit-tap-highlight-color: transparent;

      transition:
        background-color 0.15s ease,
        border-color 0.15s ease;
    }

    .button:hover {
      background: var(--button-hover);
    }

    .button:active {
      background: var(--button-hover);
    }

    .plus {
      position: absolute;

      left: 14px;
      top: 50%;

      transform: translateY(-52%);

      font-size: 22px !important;
      font-weight: 700;
      line-height: 1;

      white-space: nowrap;

      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }

    .text {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      font-size: 15px !important;
      font-weight: 600;
      line-height: 1;

      white-space: nowrap;

      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }
  </style>
</head>

<body>

  <button
    class="button"
    type="button"
    onclick="buttonClick()"
  >
    <span class="plus">+</span>
    <span class="text">일정 등록</span>
  </button>

  <script>
    function buttonClick() {
      window.open(
        "https://app.notion.com/p/3b49cc024bd580948a55fd7c44eabaa9?pvs=106",
        "_blank"
      );
    }
  </script>

</body>
</html>
