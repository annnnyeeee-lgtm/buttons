<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Buttons</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: #ffffff;
      color: #37352f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    p {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #191919;
        color: #f1f1ef;
      }
    }
  </style>
</head>
<body>
  <p>Notion Buttons</p>
</body>
</html>
