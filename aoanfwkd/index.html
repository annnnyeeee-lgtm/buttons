<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>매물장</title>

  <style>
    :root {
      color-scheme: light dark;

      --button-bg: #f1f0ed;
      --button-border: #d8d6d2;
      --button-text: #37352f;
      --button-hover: #ebeae7;
    }

    :root[data-theme="cream"] {
      --button-bg: #f4f0e9;
      --button-border: #ded5c8;
      --button-text: #403a32;
      --button-hover: #ede7de;
    }

    :root[data-theme="navy"] {
      --button-bg: #e8edf2;
      --button-border: #c8d1da;
      --button-text: #304456;
      --button-hover: #dfe6ec;
    }

    :root[data-theme="coral"] {
      --button-bg: #f3e7e4;
      --button-border: #dfc5bf;
      --button-text: #76433c;
      --button-hover: #edddda;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --button-bg: #2f2f2f;
        --button-border: #464646;
        --button-text: #f1f1ef;
        --button-hover: #393939;
      }

      :root[data-theme="cream"] {
        --button-bg: #342f29;
        --button-border: #50483f;
        --button-text: #f3eee7;
        --button-hover: #3e3831;
      }

      :root[data-theme="navy"] {
        --button-bg: #29333d;
        --button-border: #44515e;
        --button-text: #edf2f6;
        --button-hover: #333f4a;
      }

      :root[data-theme="coral"] {
        --button-bg: #3a2d2b;
        --button-border: #59413d;
        --button-text: #f4e8e5;
        --button-hover: #463532;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      background: transparent;
      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        sans-serif;

      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .button {
      width: min(350px, calc(100% - 16px));
      height: auto;
      aspect-ratio: 3.2 / 1;
      max-height: calc(100% - 4px);

      position: relative;

      margin: 0;
      padding: 0;

      border: 1px solid var(--button-border);
      border-radius: 8px;

      background: var(--button-bg);
      color: var(--button-text);

      font-family: inherit;
      cursor: pointer;

      outline: none;
      box-shadow: none;

      -webkit-tap-highlight-color: transparent;

      transition:
        background-color 0.15s ease,
        border-color 0.15s ease;
    }

    .button:hover {
      background: var(--button-hover);
    }

    .button:active {
      background: var(--button-hover);
    }

    .plus {
      position: absolute;

      left: 20px;
      top: 50%;

      transform: translateY(-52%);

      font-size: 22px !important;
      font-weight: 700;
      line-height: 1;

      white-space: nowrap;

      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }

    .plus[hidden] {
      display: none;
    }

    .text {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      font-size: 15px !important;
      font-weight: 600;
      line-height: 1;

      white-space: nowrap;

      -webkit-text-size-adjust: none;
      text-size-adjust: none;
    }
  </style>
</head>

<body>
  <button class="button" id="notionButton" type="button">
    <span class="text" id="buttonText">매물장</span>
  </button>

  <script>
    const button = document.getElementById("notionButton");
    const targetUrl = "https://app.notion.com/p/3ae9cc024bd580eca231e0d278f51125?v=3ae9cc024bd5803f8f55000c0e120e74&source=copy_link";

    document.documentElement.dataset.theme = "cream";
    button.setAttribute("aria-label", "매물장");

    button.addEventListener("click", () => {
      try {
        const destination = new URL(targetUrl);

        if (destination.protocol !== "http:" && destination.protocol !== "https:") {
          return;
        }

        window.open(destination.href, "_blank", "noopener,noreferrer");
      } catch {
        // 주소가 올바르지 않으면 이동하지 않습니다.
      }
    });
  </script>
</body>
</html>
